    <style>
      .loadingWrap {
        opacity: 1;
        color: #fff;
        position: fixed;
        background: #000;
        z-index: 9999;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .loadingWrap p {
        font-size: 24px;
        position: absolute;
        top: 60%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .sk-circle {
        width: 80px;
        height: 80px;
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .sk-circle .sk-child {
        width: 100%;
        height: 100%;
        position: absolute;
        left: 0;
        top: 0;
      }
      .sk-circle .sk-child:before {
        content: "";
        display: block;
        margin: 0 auto;
        width: 15%;
        height: 15%;
        background-color: #ffffff;
        border-radius: 100%;
        -webkit-animation: sk-circleBounceDelay 1.2s infinite ease-in-out both;
        animation: sk-circleBounceDelay 1.2s infinite ease-in-out both;
      }
      .sk-circle .sk-circle2 {
        -webkit-transform: rotate(30deg);
        -ms-transform: rotate(30deg);
        transform: rotate(30deg);
      }
      .sk-circle .sk-circle3 {
        -webkit-transform: rotate(60deg);
        -ms-transform: rotate(60deg);
        transform: rotate(60deg);
      }
      .sk-circle .sk-circle4 {
        -webkit-transform: rotate(90deg);
        -ms-transform: rotate(90deg);
        transform: rotate(90deg);
      }
      .sk-circle .sk-circle5 {
        -webkit-transform: rotate(120deg);
        -ms-transform: rotate(120deg);
        transform: rotate(120deg);
      }
      .sk-circle .sk-circle6 {
        -webkit-transform: rotate(150deg);
        -ms-transform: rotate(150deg);
        transform: rotate(150deg);
      }
      .sk-circle .sk-circle7 {
        -webkit-transform: rotate(180deg);
        -ms-transform: rotate(180deg);
        transform: rotate(180deg);
      }
      .sk-circle .sk-circle8 {
        -webkit-transform: rotate(210deg);
        -ms-transform: rotate(210deg);
        transform: rotate(210deg);
      }
      .sk-circle .sk-circle9 {
        -webkit-transform: rotate(240deg);
        -ms-transform: rotate(240deg);
        transform: rotate(240deg);
      }
      .sk-circle .sk-circle10 {
        -webkit-transform: rotate(270deg);
        -ms-transform: rotate(270deg);
        transform: rotate(270deg);
      }
      .sk-circle .sk-circle11 {
        -webkit-transform: rotate(300deg);
        -ms-transform: rotate(300deg);
        transform: rotate(300deg);
      }
      .sk-circle .sk-circle12 {
        -webkit-transform: rotate(330deg);
        -ms-transform: rotate(330deg);
        transform: rotate(330deg);
      }
      .sk-circle .sk-circle2:before {
        -webkit-animation-delay: -1.1s;
        animation-delay: -1.1s;
      }
      .sk-circle .sk-circle3:before {
        -webkit-animation-delay: -1s;
        animation-delay: -1s;
      }
      .sk-circle .sk-circle4:before {
        -webkit-animation-delay: -0.9s;
        animation-delay: -0.9s;
      }
      .sk-circle .sk-circle5:before {
        -webkit-animation-delay: -0.8s;
        animation-delay: -0.8s;
      }
      .sk-circle .sk-circle6:before {
        -webkit-animation-delay: -0.7s;
        animation-delay: -0.7s;
      }
      .sk-circle .sk-circle7:before {
        -webkit-animation-delay: -0.6s;
        animation-delay: -0.6s;
      }
      .sk-circle .sk-circle8:before {
        -webkit-animation-delay: -0.5s;
        animation-delay: -0.5s;
      }
      .sk-circle .sk-circle9:before {
        -webkit-animation-delay: -0.4s;
        animation-delay: -0.4s;
      }
      .sk-circle .sk-circle10:before {
        -webkit-animation-delay: -0.3s;
        animation-delay: -0.3s;
      }
      .sk-circle .sk-circle11:before {
        -webkit-animation-delay: -0.2s;
        animation-delay: -0.2s;
      }
      .sk-circle .sk-circle12:before {
        -webkit-animation-delay: -0.1s;
        animation-delay: -0.1s;
      }

      @media (max-width: 600px) {
        .sk-circle {
          width: 50px;
          height: 50px;
        }
        .loadingWrap p {
          font-size: 14px;
          top: 62%;
        }
      }

      @-webkit-keyframes sk-circleBounceDelay {
        0%,
        80%,
        100% {
          -webkit-transform: scale(0);
          transform: scale(0);
        }
        40% {
          -webkit-transform: scale(1);
          transform: scale(1);
        }
      }

      @keyframes sk-circleBounceDelay {
        0%,
        80%,
        100% {
          -webkit-transform: scale(0);
          transform: scale(0);
        }
        40% {
          -webkit-transform: scale(1);
          transform: scale(1);
        }
      }
    </style>

    <script type="text/javascript">
      function doScroll() {
        if (window.pageYOffset === 0) {
          window.scrollTo(0, 1);
        }
      }
      window.onload = function () {
        setTimeout(doScroll, 100);
        if ('addEventListener' in document && FastClick) {
          FastClick.attach(document.body);
        }
      };
    </script>

    <script type="text/javascript">
      function checkOrientation() {
        if (window.matchMedia("(orientation: portrait)").matches) {
          document.body.style.position = "absolute";
          document.body.style.top = "50%";
          document.body.style.left = "50%";
          document.body.style.transform = "translate(-50%, -50%) rotate(90deg)";
          document.body.style.width = `${window.innerHeight}px`;
          document.body.style.height = `${window.innerWidth}px`;
          document.body.style.transformOrigin = "center center";
        } else {
          document.body.style.position = "relative";
          document.body.style.top = "0";
          document.body.style.left = "0";
          document.body.style.transform = "none";
          document.body.style.width = `${window.innerWidth}px`;
          document.body.style.height = `${window.innerHeight}px`;
        }
      }

      function lockOrientation() {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("portrait").catch(function (error) {
            console.error(`Screen orientation lock failed: ${error}`);
          });
        }
      }

      function unlockOrientation() {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }

      window.addEventListener("load", () => {
        checkOrientation();
        lockOrientation();
        window.addEventListener("resize", checkOrientation);
      });

      window.addEventListener("beforeunload", () => {
        window.removeEventListener("resize", checkOrientation);
        unlockOrientation();
      });

    </script>
